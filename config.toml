[tools]
"aqua:neovim/neovim" = "latest"
"github:tomrford/grepo" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
atuin = "latest"
bat = "latest"
bun = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
lazygit = "latest"
node = "24"
pnpm = "latest"
ripgrep = "latest"
starship = "latest"
tmux = "latest"
uv = "latest"
zoxide = "latest"
rust = "latest"
zig = "0.16.0"

[bootstrap.packages]
"brew:fish" = "latest"
"brew:git" = "latest"
"brew:mole" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:aldente" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:kitlangton-hex" = "latest"
"brew-cask:middleclick" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:tailscale-app" = "latest"
"brew-cask:visual-studio-code" = "latest"

[env]
EDITOR = "nvim"
PAGER = "less -FirSwX"
BUN_INSTALL = "{{env.HOME}}/.bun"
GOPATH = "{{env.HOME}}/code/go"
GOPRIVATE = "github.com/tomrford"
OPENAI_API_KEY = "op://Personal/OPENAI_API_KEY/credential"
OPENROUTER_API_KEY = "op://Personal/OPENROUTER_API_KEY/credential"
_.path = [
  "~/.bun/bin",
  "~/.cargo/bin",
  "~/.local/bin",
  "~/.local/share/pnpm/bin",
  "/opt/homebrew/bin",
]

[settings]
dotfiles.root = "~/.config/mise"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.agents/skills" = {}
"~/.codex/AGENTS.md" = {}
"~/.config/.bunfig.toml" = {}
"~/.config/fish/conf.d/ssh-agent.fish" = {}
"~/.config/fish/config.fish" = {}
"~/.config/git/config" = {}
"~/.config/ghostty" = {}
"~/.config/nvim" = {}
"~/.config/pnpm" = {}
"~/.config/starship.toml" = {}
"~/.config/tmux" = {}
"~/.config/uv" = {}
"~/.hushlogin" = {}
"~/.local/bin/papercut" = {}
"~/.zshenv" = {}
"~/.zshrc" = {}

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"
